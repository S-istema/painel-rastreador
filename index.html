<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreamento</title>
    <!-- Importa o Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f1f1; }
        #header { padding: 15px; background: #333; color: white; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        #header h2 { margin: 0; font-size: 20px; }
        #map { height: 80vh; width: 100%; }
        #info { padding: 10px; text-align: center; font-size: 14px; background: #fff; border-top: 1px solid #ccc; }
        
        /* Estilo do botão de Satélite */
        #btnSatelite { 
            padding: 8px 15px; 
            background: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 14px;
        }
        #btnSatelite.active { background: #0056b3; border: 2px solid #fff; }
    </style>
</head>
<body>
    <div id="header">
        <h2>🗺️ Painel do Rastreador</h2>
        <button id="btnSatelite" onclick="toggleSatelite()">🛰️ Satélite</button>
    </div>
    <div id="map"></div>
    <div id="info">Aguardando sinal do rastreador...</div>

    <!-- Importa o script do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializa o mapa centrado no Brasil
        const map = L.map('map').setView([-14.235, -51.925], 4);

        // Camada de Mapa (Ruas)
        const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Camada de Satélite (ESRI - Imagens gratuitas)
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, Maxar, Earthstar Geographics'
        });

        let isSatellite = false;

        // Função para alternar entre Satélite e Ruas
        function toggleSatelite() {
            if (isSatellite) {
                map.removeLayer(satellite);
                map.addLayer(streets);
                document.getElementById('btnSatelite').classList.remove('active');
            } else {
                map.removeLayer(streets);
                map.addLayer(satellite);
                document.getElementById('btnSatelite').classList.add('active');
            }
            isSatellite = !isSatellite;
        }

        let marker = null;
        let accuracyCircle = null;

        // Conecta ao canal do Rastreador
        const channel = new BroadcastChannel('rastreamento_channel');

        channel.onmessage = (event) => {
            const { nome, lat, lng, accuracy } = event.data;

            // Se for o primeiro sinal, cria o marcador com o nome (Popup)
            if (!marker) {
                marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`<b>${nome}</b>`).openPopup(); // Mostra o nome
                
                accuracyCircle = L.circle([lat, lng], { radius: accuracy, color: '#4CAF50', fillOpacity: 0.2 }).addTo(map);
            } else {
                // Move o marcador existente
                marker.setLatLng([lat, lng]);
                marker.setPopupContent(`<b>${nome}</b>`); // Atualiza o nome caso tenha mudado
                marker.openPopup();
                
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy);
            }

            // Centraliza o mapa no rastreador
            map.setView([lat, lng], 16);

            // Atualiza as informações com o nome
            document.getElementById('info').innerHTML = 
                `<strong>🚀 ${nome}</strong> <br> Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)} <br> Precisão: ${accuracy.toFixed(0)}m`;
        };
    </script>
</body>
</html>
